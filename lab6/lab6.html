<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Author" lang="uk" content="Коман Руслан">
    <meta name="Keywords" content="Web - SVG">
    <title>Лабораторна робота №6</title>
</head>
<body>
    <svg version="1.1"
       baseProfile="full"
       xmlns="http://www.w3.org/2000/svg"
       xmlns:xlink="http://www.w3.org/1999/xlink"
       width="660px"
       height="470px"
       viewBox="0 0 660 470">
    <desc>Варіант 8</desc>

    <defs>
      <symbol id="sq" viewBox="0 0 60 60" width="60" height="60" overflow="visible">
        <rect x="0" y="0" width="60" height="60" fill="blue" stroke="black" stroke-width="1"/>
      </symbol>
      <path id="curve" d="M 40,90 Q 330,-10 620,90" fill="none"/>
    </defs>

    <use xlink:href="#curve" stroke="lightgray" stroke-width="1"/>
    <text font-family="Times New Roman, serif" font-size="26" fill="darkred" text-anchor="middle">
      <textPath xlink:href="#curve" startOffset="50%">Лабораторна номер 6, варіант 8</textPath>
    </text>

    <g transform="translate(0,70)">

      <g id="shapes" fill="blue" stroke="black" stroke-width="1">

        <rect x="260" y="40" width="180" height="60"/>

        <rect x="80" y="160" width="120" height="60"/>

        <polygon points="260,220 380,220 320,100"/>

        <circle cx="440" cy="160" r="60">
          <animate attributeName="fill"
          values="blue;red;yellow;green;blue"
          dur="6s"
          repeatCount="indefinite"/>
        </circle>

        <g transform="translate(320 280)">
          <g>
            <animateTransform
            attributeName="transform"
            type="scale"
            values="1;1.3;0.7;1"
            dur="4s"
            repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="60"/>
          </g>
        </g>
      </g>

      <g id="squares">
        <use xlink:href="#sq" x="200" y="100" width="60" height="60"/>
        <use xlink:href="#sq" x="200" y="280" width="60" height="60"/>
      </g>

      <g>
        <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0; 80 0; 0 0"
        dur="3s"
        repeatCount="indefinite"/>
        <use xlink:href="#sq" x="500" y="280" width="60" height="60"/>
      </g>

      <g transform="translate(530 130)">
        <g>
          <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="5s"
          repeatCount="indefinite"/>
          <use xlink:href="#sq" x="-30" y="-30" width="60" height="60"/>
        </g>
      </g>

      <g transform="translate(410 310)">
        <g>
          <animateTransform
          attributeName="transform"
          type="skewX"
          values="0; 30; -30; 0"
          dur="4s"
          repeatCount="indefinite"/>
          <use xlink:href="#sq" x="-30" y="-30" width="60" height="60"/>
        </g>
      </g>

      <g id="axes" stroke="black" stroke-width="2" fill="black">
        <line x1="40" y1="220" x2="552" y2="220"/>
        <polygon points="565,220 548,213 548,227"/>
        <line x1="200" y1="375" x2="200" y2="30"/>
        <polygon points="200,16 193,33 207,33"/>
      </g>

      <g id="ticks" stroke="black" stroke-width="1">
        <line x1="80"  y1="202" x2="80"  y2="238"/>
        <line x1="140" y1="202" x2="140" y2="238"/>
        <line x1="260" y1="202" x2="260" y2="238"/>
        <line x1="320" y1="202" x2="320" y2="238"/>
        <line x1="380" y1="202" x2="380" y2="238"/>
        <line x1="440" y1="202" x2="440" y2="238"/>
        <line x1="500" y1="202" x2="500" y2="238"/>

        <line x1="185" y1="100" x2="215" y2="100"/>
        <line x1="185" y1="160" x2="215" y2="160"/>
        <line x1="185" y1="280" x2="215" y2="280"/>
        <line x1="185" y1="340" x2="215" y2="340"/>
      </g>

      <g id="labels" font-family="Times New Roman, serif" font-size="22" fill="black">
        <text x="222" y="55">Y</text>
        <text x="568" y="248">X</text>

        <text x="180" y="245" text-anchor="end">0</text>
        <text x="70"  y="245" text-anchor="middle">-2</text>
        <text x="130" y="245" text-anchor="middle">-1</text>
        <text x="258" y="245" text-anchor="middle">1</text>
        <text x="324" y="245" text-anchor="middle">2</text>
        <text x="385" y="245" text-anchor="middle">3</text>
        <text x="445" y="245" text-anchor="middle">4</text>
        <text x="505" y="245" text-anchor="middle">5</text>

        <text x="180" y="118" text-anchor="end">2</text>
        <text x="208" y="190">1</text>
        <text x="180" y="305" text-anchor="end">-1</text>
        <text x="180" y="365" text-anchor="end">-2</text>
      </g>
    </g>
  </svg>
</body>
</html>
